services:
  portfolio:
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    init: true
    restart: unless-stopped
  development:
    profiles: [dev]
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - .:/app
      - development_modules:/app/node_modules
      - development_next:/app/.next
    init: true
    restart: unless-stopped
volumes:
  development_modules:
  development_next:
